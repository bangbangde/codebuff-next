name: codebuff-local

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-codebuff}
      POSTGRES_PASSWORD: ${PG_PWD:-codebuff}
      POSTGRES_DB: ${PG_DB:-codebuff_next}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 5

  garage:
    build:
      context: .
      dockerfile: Dockerfile.garage
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
      - "127.0.0.1:${GARAGE_RPC_PORT:-3901}:3901"
      - "127.0.0.1:${GARAGE_WEB_PORT:-3902}:3902"
    volumes:
      - garage_data:/var/lib/garage
    configs:
      - source: garage_config
        target: /etc/garage/garage.toml
    environment:
      GARAGE_CONFIG_FILE: /etc/garage/garage.toml
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/garage-layout-ready && /garage status"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    working_dir: /app
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-codebuff}
      PG_PWD: ${PG_PWD:-codebuff}
      PG_DB: ${PG_DB:-codebuff_next}
      PG_POOL_MAX: ${PG_POOL_MAX:-5}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-10000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRETS: ${BETTER_AUTH_SECRETS:-0:dev-local-secret-that-must-be-at-least-32-characters-long-for-better-auth}
    depends_on:
      init:
        condition: service_completed_successfully
      garage:
        condition: service_healthy
    profiles:
      - app
    tty: true
    stdin_open: true
    restart: no

  init:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-codebuff}
      PG_PWD: ${PG_PWD:-codebuff}
      PG_DB: ${PG_DB:-codebuff_next}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-10000}
      AUTH_BOOTSTRAP_NAME: ${AUTH_BOOTSTRAP_NAME:-Codebuff Admin}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-admin@codebuff.local}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-Local-Dev-Bootstrap-Password}
      AUTH_BOOTSTRAP_IF_MISSING: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  garage_data:
  node_modules:
  next_cache:

configs:
  garage_config:
    file: ./docker/garage.toml
