name: codebuff-local

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-codebuff}
      POSTGRES_PASSWORD: ${PG_PWD:-codebuff}
      POSTGRES_DB: ${PG_DB:-codebuff_next}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-healthcheck.sh:/usr/local/bin/postgres-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/postgres-healthcheck.sh"]
      interval: 10s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 5

  garage:
    build:
      context: .
      dockerfile: Dockerfile.garage
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
      - "127.0.0.1:${GARAGE_RPC_PORT:-3901}:3901"
      - "127.0.0.1:${GARAGE_WEB_PORT:-3902}:3902"
    volumes:
      - garage_data:/var/lib/garage
    configs:
      - source: garage_config
        target: /etc/garage/garage.toml
    environment:
      GARAGE_CONFIG_FILE: /etc/garage/garage.toml
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-codebuff-next-media}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-GK0123456789abcdef01234567}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/garage-layout-ready && /garage status"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  garage_data:

configs:
  garage_config:
    file: ./docker/garage.toml
