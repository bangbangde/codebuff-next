services:
  app:
    profiles: ["app"]
    init: true
    build:
      context: ..
      dockerfile: local-development/docker/app/Dockerfile
    command:
      - sh
      - -lc
      - pnpm install --frozen-lockfile --offline --store-dir=/pnpm/store && pnpm exec next dev --hostname 0.0.0.0 --port 3000
    working_dir: /workspace
    environment:
      PG_USER: ${DEV_POSTGRES_USER:-codebuff}
      PG_PWD: ${DEV_POSTGRES_PASSWORD:-codebuff}
      PG_DB: ${DEV_POSTGRES_DB:-codebuff_next}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_POOL_MAX: 5
      PG_CONNECTION_TIMEOUT_MS: 10000
      BETTER_AUTH_URL: http://localhost:${APP_PORT:-3000}
      PASSKEY_RP_ID: localhost
      BETTER_AUTH_SECRETS: ${BETTER_AUTH_SECRETS}
      OBJECT_STORAGE_ENDPOINT: http://garage:3900
      OBJECT_STORAGE_REGION: garage
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ..:/workspace
      - app_node_modules:/workspace/node_modules
      - app_next_cache:/workspace/.next
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy

  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-codebuff}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-codebuff}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-codebuff_next}
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 10s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    command:
      - /garage
      - server
      - --single-node
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_GARAGE_S3_PORT:-3900}:3900"
      - "127.0.0.1:${DEV_GARAGE_RPC_PORT:-3901}:3901"
      - "127.0.0.1:${DEV_GARAGE_WEB_PORT:-3902}:3902"
      - "127.0.0.1:${DEV_GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - garage_v2_data:/var/lib/garage
    configs:
      - source: garage_config
        target: /etc/garage.toml
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 3

volumes:
  app_node_modules:
  app_next_cache:
  postgres_data:
  # Garage 1.x data is intentionally not mounted into Garage 2.x. Keeping the
  # legacy volume declared lets local reset/destroy remove it explicitly.
  garage_data:
  garage_v2_data:

configs:
  garage_config:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"
      replication_factor = 1

      # Fixed development-only secret. Production must inject a generated secret.
      rpc_secret = "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "garage:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

      [s3_web]
      bind_addr = "[::]:3902"
      root_domain = ".web.garage.localhost"

      [admin]
      api_bind_addr = "[::]:3903"
      admin_token = "${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is required}"
