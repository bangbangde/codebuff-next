name: CI and Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  GHCR_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/codebuff-next
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_IMAGE_NAME: ccr.ccs.tencentyun.com/${{ vars.TCR_NAMESPACE }}/codebuff-next

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated database artifacts
        run: |
          pnpm auth:schema
          pnpm db:generate
          git diff --exit-code -- lib/db/schema.ts drizzle
          test -z "$(git status --porcelain --untracked-files=all -- lib/db/schema.ts drizzle)"

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4

      - name: Build verification image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: codebuff-next:verify
          cache-from: type=gha,scope=codebuff-next
          cache-to: type=gha,mode=max,scope=codebuff-next

      - name: Verify application image without database credentials
        if: github.event_name == 'push'
        run: |
          container_id="$(docker run --detach --publish 3000:3000 codebuff-next:verify)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..20}; do
            all_routes_ready=true

            for route in "/" "/me" "/notes/ai-native-interface-work"; do
              if ! curl --fail --silent --output /dev/null "http://127.0.0.1:3000${route}"; then
                all_routes_ready=false
                break
              fi
            done

            if [[ "$all_routes_ready" == "true" ]]; then
              exit 0
            fi

            sleep 1
          done

          docker logs "$container_id"
          exit 1

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release tag
        id: release_tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Tencent Cloud registry configuration
        env:
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          if [[ -z "$TCR_NAMESPACE" ]]; then
            echo "Missing repository variable: TCR_NAMESPACE"
            exit 1
          fi

          if [[ -z "$TCR_USERNAME" ]]; then
            echo "Missing repository secret: TCR_USERNAME"
            exit 1
          fi

          if [[ -z "$TCR_PASSWORD" ]]; then
            echo "Missing repository secret: TCR_PASSWORD"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Tencent Cloud Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE_NAME }}
            ${{ env.TCR_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ steps.release_tag.outputs.is_stable == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=codebuff-next

      - name: Trigger infrastructure deployment
        # v4.0.1
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: bangbangde/my-cloud-infra
          event-type: app-update
          client-payload: >-
            {"service":"codebuff-next","image_tag":"sha-${{ github.sha }}"}
